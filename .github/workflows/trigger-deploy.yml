name: Trigger Main Deploy
on:
  push:
    branches:
      - portfolio-v2
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger developer-portfolio deploy
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.DEPLOY_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'pawankumar29',
              repo: 'developer-portfolio',
              workflow_id: 'deploy.yml',
              ref: 'portfolio-v2'
            })